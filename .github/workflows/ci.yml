name: CI and Worker Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"
  PYTHON_VERSION: "3.13"
  DEVELOPMENT_URL: https://dev-topostack.echofoxtrot.works
  PRODUCTION_URL: https://topostack.echofoxtrot.works

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check release version consistency
        run: npm run version:check

      - name: Audit production and build dependencies
        run: npm audit --audit-level=moderate

      - name: Verify generated Worker types
        run: npm run types:check -w @topostack/map-api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test provisioning and lifecycle safeguards
        run: npm run test:scripts

      - name: Test unit and component suites with coverage thresholds
        run: npm run test:coverage

  python-data-tools:
    name: Python data tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: python-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/survey-requirements.txt

      # survey-requirements.txt pins a superset of the NOAA and terrain builder
      # dependencies (numpy, rasterio, Pillow, fiona, scipy, shapely).
      - name: Install pinned builder dependencies
        run: python -m pip install -r scripts/survey-requirements.txt

      - name: Test bathymetry, terrain, and lake outline builders
        run: python -m unittest discover -s scripts -p 'test_*.py'

  build-and-budget:
    name: Build and budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_SITE_ENV: production

      - name: Verify production search metadata
        run: node scripts/verify-seo.mjs --environment production

      - name: Enforce web performance budgets
        run: npm run budget:web

      # This build intentionally embeds the hermetic https://ci.invalid
      # sentinel, which the endpoint scan would reject. Packaging and release
      # runs always execute the full endpoint scan.
      - name: Verify Atomm static artifact
        run: node scripts/verify-atomm-dist.mjs --skip-endpoint-scan

      - name: Verify development indexing exclusion
        run: |
          npm run build -w @topostack/generator
          node scripts/verify-seo.mjs --environment development
        env:
          VITE_SITE_ENV: development

  browser-tests:
    name: Browser E2E (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: browser-${{ matrix.browser }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Test browser generation and export
        run: xvfb-run --auto-servernum npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required check name while every browser runs independently.
  browser-e2e:
    name: Browser E2E
    needs: browser-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = success

  deploy-worker:
    name: Deploy Worker
    needs: [quality, python-data-tools, build-and-budget, browser-e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
    concurrency:
      group: map-api-${{ github.ref_name == 'main' && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend for same-origin deployment
        run: npm run build -w @topostack/generator
        env:
          VITE_SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}

      - name: Verify search indexing policy
        run: node scripts/verify-seo.mjs --environment ${{ github.ref_name == 'main' && 'production' || 'development' }}

      - name: Deploy app, map API, and synchronize Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/map-api
          wranglerVersion: "4.131.1"
          environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          command: deploy --env ${{ github.ref_name == 'main' && 'production' || 'development' }}
          secrets: |
            GEOCODER_API_KEY
        env:
          GEOCODER_API_KEY: ${{ secrets.GEOCODER_API_KEY }}

      - name: Smoke test deployed Worker
        run: node scripts/verify-worker-deployment.mjs
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          PUBLIC_APP_URL: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
          EXPECTED_WORKER_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

  package-atomm:
    name: Package Atomm release
    needs: deploy-worker
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atomm-release-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production Atomm release
        run: npm run release:atomm && npm run package:atomm-listing
        env:
          VITE_MAP_API_URL: ${{ env.PRODUCTION_URL }}
          VITE_SITE_ENV: atomm

      - name: Upload production Atomm release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: topostack-atomm-${{ github.sha }}
          path: |
            apps/generator/topostack-atomm.zip
            apps/generator/topostack-atomm.zip.sha256
            apps/generator/topostack-atomm.release.json
            atomm/topostack-listing-upload.zip
          if-no-files-found: error
          retention-days: 30
